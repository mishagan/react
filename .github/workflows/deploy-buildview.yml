# Deploy the BuildView demo (buildview/) to GitHub Pages.
# Scoped to the BuildView development branch only — none of the upstream React
# workflows are affected. Requires repo Settings → Pages → Source = "GitHub Actions".
name: Deploy BuildView to Pages

on:
  push:
    branches: [claude/lucid-newton-npdvws]
    paths: ['buildview/**', '.github/workflows/deploy-buildview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-buildview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: buildview
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci || npm install
      - name: Logic checks + render smoke
        working-directory: buildview
        run: npm run check
      - name: Build (subpath = /<repo>/)
        working-directory: buildview
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: buildview/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
